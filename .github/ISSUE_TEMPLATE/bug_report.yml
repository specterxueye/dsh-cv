name: 问题报告
description: 安装、生成或使用问题
body:
  - type: input
    id: versions
    attributes:
      label: 插件、DSH、Node 与系统版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 资料确认
      options:
        - label: 未包含真实个人资料、凭据或漏洞利用细节
          required: true
